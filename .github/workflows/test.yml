name: Demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TF_ENABLE_ONEDNN_OPTS: '0'
      TF_CPP_MIN_LOG_LEVEL: '3'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media, OCR and font tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr fonts-noto-core fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Cache verified model assets
        uses: actions/cache@v4
        with:
          path: external
          key: detector-assets-${{ hashFiles('detector/*files.json', 'detector/audio_models.json', 'detector/audio_selection.json', 'detector/assets.py') }}
      - name: Set up and verify models and OCR
        run: python scripts/setup_models.py
      - name: Run routing, OCR, model and failure tests
        run: python -m pytest -q
      - name: Verify full video upload
        run: python scripts/smoke_video.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Check unified website in a real browser
        run: python scripts/browser_smoke.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-screenshots
          path: browser-results
          if-no-files-found: ignore
